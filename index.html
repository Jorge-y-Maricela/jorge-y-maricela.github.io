<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Boda de Jorge &amp; Maricela · 11 de diciembre de 2026</title>
  <meta name="description" content="Con la bendición de Dios y de nuestros padres, te invitamos a celebrar nuestra boda. Viernes 11 de diciembre de 2026 · Salón La Terraza, Fracc. Villarreal, Chiapas.">
  <meta name="theme-color" content="#FFFEFB">
  <meta name="color-scheme" content="light only">
  <meta name="darkreader-lock">

  <!-- Vista previa al compartir (WhatsApp, Facebook…). Cambia TU-DOMINIO.com por la dirección real. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_MX">
  <meta property="og:title" content="Jorge &amp; Maricela · ¡Nos casamos!">
  <meta property="og:description" content="Viernes 11 de diciembre de 2026 · Salón La Terraza, Fracc. Villarreal. Toca para abrir tu invitación.">
  <meta property="og:url" content="https://jorge-y-maricela.github.io/">
  <meta property="og:image" content="https://jorge-y-maricela.github.io/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Invitación de boda de Jorge y Maricela">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="img/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="img/icono-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Parisienne&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a class="saltar" href="#contenido">Ir a la invitación</a>

  <!-- Sobre de bienvenida -->
  <div class="sobre-escena" id="sobre-escena" hidden>
    <div class="sobre-escena__marco">
      <p class="sobre-escena__antes">Tienes una invitación de</p>
      <p class="sobre-escena__nombres" id="sobre-nombres"></p>
      <button class="sobre" id="sobre" type="button" aria-label="Abrir la invitación">
        <span class="sobre__fondo"></span>
        <span class="sobre__carta" id="sobre-carta"></span>
        <span class="sobre__frente"></span>
        <span class="sobre__solapa"><span class="sobre__solapa-ext"></span><span class="sobre__solapa-int"></span></span>
        <span class="sobre__sello" id="sobre-sello"></span>
      </button>
      <p class="sobre-escena__pista">Toca el sello para abrir</p>
    </div>
  </div>

  <div class="pagina">
    <main class="invitacion" id="contenido" tabindex="-1">
      <noscript><p class="sin-js">Para ver la invitación activa JavaScript en tu navegador.</p></noscript>
    </main>
  </div>

  <button class="musica" id="boton-musica" type="button" hidden aria-pressed="false" aria-label="Reproducir la música"></button>

  <dialog class="visor" id="visor">
    <button class="visor__cerrar" type="button" aria-label="Cerrar">×</button>
    <img alt="">
  </dialog>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="js/decoracion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
